name: Daily weather notification

on:
  schedule:
    # 22:00 UTC is 07:00 the next day in Japan (JST, UTC+9).
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send forecast
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python weather.py
